[package]
name = "jpp"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "J++ host crate (L6, B74): lib target (facade and Session; store and backends modules) and bin target (command line)"

# B74（步 14a）：`jpp` = 改名后的 `jpp-cli` 加 lib 目标。lib 承载外观与 `Session`（`session/`）、
# 存储（`store/`，步 18）、真机端口（`backends/`）；bin 承载命令行（`cli/`）。原 `jpp-core` 已删除。
[lib]
name = "jpp"
path = "src/lib.rs"

[[bin]]
name = "jpp"
path = "src/cli/main.rs"

[dependencies]
jpp-ir = { path = "../jpp-ir" }
jpp-value = { path = "../jpp-value" }
jpp-effects = { path = "../jpp-effects" }
jpp-ledger = { path = "../jpp-ledger" }
jpp-calib = { path = "../jpp-calib" }
jpp-check = { path = "../jpp-check" }
jpp-plan = { path = "../jpp-plan" }
jpp-runtime = { path = "../jpp-runtime" }
jpp-syntax = { path = "../jpp-syntax" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
ureq = { version = "2", features = ["json"], optional = true }

[features]
default = []
# `--backend live` 只在这个 feature 开着时才能真的发请求；`ureq` 只由它引入（`20` §2.2 第 1 条）。
live = ["ureq"]

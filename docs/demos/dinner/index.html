<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>杭州聚餐</title>
<meta name="description" content="五个杭州朋友聚餐：一屏一个画面，自动播放一次真机运行的十二步。数据全部取自真机报告与账本。">
<style>
:root{
  --bg:#0d0f13; --stage:#12151b; --panel:#1a1e26; --line:#2a303b;
  --ink:#eef1f5; --ink2:#a3acba; --ink3:#626b7a; --dim:#2c323d;
  --good:#3ddc97; --bad:#ff5d5d; --maybe:#ffb547; --hi:#ffffff;
  --lake:#16303a; --lake-ink:#2d5866; --road:#1c2129;
  --sans:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
/* 顶部：组切换 + 一句标题 + 至多三个大数字 */
.top{flex:0 0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:12px 32px;padding:14px 28px 10px}
.meta{grid-column:1/-1;display:flex;align-items:center;gap:6px;min-height:28px}
.gbtn{border:1px solid var(--line);background:transparent;color:var(--ink2);padding:3px 12px;border-radius:999px;cursor:pointer;font-size:13px}
.gbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stepno{margin-left:auto;font:600 13px var(--mono);color:var(--ink3)}
.info{border:1px solid var(--line);background:transparent;color:var(--ink2);width:26px;height:26px;border-radius:50%;cursor:pointer;font:600 13px/1 Georgia,serif}
h1{margin:0;font-size:clamp(26px,3.1vw,50px);line-height:1.12;font-weight:700;letter-spacing:.02em;min-width:0}
h1 .in{display:inline-block;animation:rise .5s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.nums{display:flex;gap:28px;align-items:flex-end}
.num{text-align:right;min-width:64px}
.num b{display:block;font:700 clamp(26px,2.9vw,46px)/1 var(--mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.num span{display:block;font-size:12px;color:var(--ink2);margin-top:4px;white-space:nowrap}
.num.maybe b{color:var(--maybe)} .num.good b{color:var(--good)} .num.bad b{color:var(--bad)}
/* 主画面 */
.stage{flex:1 1 auto;position:relative;min-height:0;margin:0 16px;border-radius:16px;background:var(--stage);overflow:hidden}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.legend{position:absolute;left:12px;bottom:10px;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--ink2);pointer-events:none;max-width:calc(100% - 24px);background:rgba(13,15,19,.55);padding:4px 8px;border-radius:8px}
.legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.legend svg{position:static;width:auto;height:auto;display:inline}
.credit{position:absolute;right:12px;bottom:10px;font-size:10px;color:var(--ink3);pointer-events:none}
/* 底部：播放 + 细进度条 */
.bottom{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:10px 28px 14px}
.pp{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:grid;place-items:center;flex:0 0 auto}
.pp svg{width:14px;height:14px}
.track{flex:1;position:relative;height:22px;cursor:pointer;touch-action:none}
.rail{position:absolute;left:0;right:0;top:9px;height:4px;border-radius:2px;background:var(--dim);overflow:hidden}
.fill{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.tick{position:absolute;top:6px;width:2px;height:10px;background:var(--bg)}
.knob{position:absolute;top:4px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 4px rgba(255,255,255,.08)}
/* 浮层 */
.pop{position:fixed;z-index:20;max-width:340px;max-height:62vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.6;color:var(--ink2);box-shadow:0 16px 40px -12px rgba(0,0,0,.7);display:none}
.pop.show{display:block}
.pop h4{margin:0 0 6px;font-size:14px;color:var(--ink)}
.pop .q{color:var(--ink);margin:0 0 8px}
.pop .mat{font-size:12px;color:var(--ink2);border-left:2px solid var(--line);padding-left:8px;margin:8px 0 0}
.pop .row{display:flex;justify-content:space-between;gap:10px}
.pop .x{position:sticky;top:0;float:right;border:none;background:none;color:var(--ink3);cursor:pointer;font-size:16px;line-height:1;margin:-4px -6px 0 0}
.pop .note{font-size:12px;color:var(--ink3)}
.gauge{position:relative;height:10px;border-radius:5px;background:var(--dim);margin:8px 0 4px}
.gauge .band{position:absolute;left:30%;width:40%;top:0;bottom:0;background:rgba(255,181,71,.28)}
.gauge .nd{position:absolute;top:-4px;width:3px;height:18px;border-radius:2px;background:var(--ink)}
.chip{display:inline-block;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600}
.chip.good{background:rgba(61,220,151,.16);color:var(--good)} .chip.bad{background:rgba(255,93,93,.16);color:var(--bad)} .chip.maybe{background:rgba(255,181,71,.16);color:var(--maybe)} .chip.none{background:var(--dim);color:var(--ink2)}
.dist{display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:center;font-size:12px;margin-top:6px}
.dist i{display:block;height:8px;border-radius:4px;background:var(--ink2)}
/* SVG 语法：颜色只表示判断结果；亮度表示在不在场；动作表示变化 */
svg text{font-family:var(--sans)}
.hit{cursor:pointer}
.fade{opacity:0;transition:opacity .5s}
.fade.on{opacity:1}
.pop-in{opacity:0;transform:scale(.3);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .5s cubic-bezier(.2,1.4,.4,1)}
.pop-in.on{opacity:1;transform:none}
.e{stroke:var(--dim);transition:stroke .45s,opacity .45s,stroke-width .45s}
.e.on{stroke:var(--c1)} .e.on2{stroke:var(--c2)}
.e.maybe1.on:not(.on2),.e.maybe2.on2{stroke-dasharray:9 7}
.f{fill:var(--dim);transition:fill .4s,opacity .4s}
.f.on{fill:var(--c1)} .f.on2{fill:var(--c2)}
.glow{opacity:0;transition:opacity .5s}
.glow.on{opacity:1;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.mv{transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.dimmable{transition:opacity .5s}
.dimmable.off{opacity:.14}
.pk{opacity:0;transition:transform .9s cubic-bezier(.5,0,.2,1),opacity .3s}
.pk.on{opacity:1}
.pk.on2{opacity:0;transition:opacity .4s}
.ring{opacity:0}
.ring.on{animation:ring 1s ease-out 1 forwards}
@keyframes ring{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(2.2)}}
.dots .d{transition:opacity .6s}
html.freeze *,html.freeze *::before,html.freeze *::after{transition:none!important;animation:none!important}
html.freeze .glow.on{opacity:1}
/* 手机竖屏：可纵向滚动，不横向滚动 */
@media (max-width:700px){
  .app{height:auto;min-height:100dvh;overflow:visible}
  .top{grid-template-columns:minmax(0,1fr);padding:10px 16px 8px;gap:8px}
  .meta{flex-wrap:nowrap;overflow:hidden}
  .gbtn{padding:2px 9px;font-size:12px}
  h1{font-size:23px}
  .nums{justify-content:flex-start;gap:20px}
  .num{text-align:left;min-width:0}
  .num b{font-size:26px}
  .stage{flex:1 1 auto;min-height:440px;margin:0 16px}
  .bottom{padding:10px 16px 14px;position:sticky;bottom:0;background:var(--bg)}
  .pop{max-width:calc(100vw - 32px)}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="meta">
      <div id="groups" role="group" aria-label="切换人物组" style="display:flex;gap:6px"></div>
      <span class="stepno" id="stepno"></span>
      <button class="info" id="info" aria-label="数据来源与说明">i</button>
    </div>
    <h1 id="title"></h1>
    <div class="nums" id="nums"></div>
  </header>
  <main class="stage" id="stage" aria-live="polite">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg" role="img"></svg>
    <div class="legend" id="legend"></div>
    <div class="credit" id="credit"></div>
  </main>
  <footer class="bottom">
    <button class="pp" id="pp" aria-label="暂停"></button>
    <div class="track" id="track" role="slider" aria-label="播放进度" tabindex="0"><div class="rail"><div class="fill" id="fill"></div><div id="ticks"></div></div><div class="knob" id="knob"></div></div>
  </footer>
</div>
<div class="pop" id="pop" role="dialog"></div>
<pre id="check" hidden></pre>
<script>window.__errs = []; window.addEventListener("error", e => window.__errs.push(String(e.message || e))); window.addEventListener("unhandledrejection", e => window.__errs.push("promise: " + String(e.reason)));</script>
<script src="data.js"></script>
<script>
"use strict";
const D = window.DINNER;
const G_NAMES = Object.keys(D.组);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
const seg = (p, a, b) => ease(clamp((p - a) / (b - a)));
const S = {g: G_NAMES[0], t: 0, playing: true, idx: -1, cur: null, W: 0, H: 0, freeze: false, last: 0};

// ───────── 数据访问 ─────────
const grp = () => D.组[S.g];
const R = () => grp().结果;
const people = () => grp().人物.人;
const names = () => people().map(p => p.名);
const PAL = ["#5b9dff", "#a78bfa", "#f472b6", "#22d3ee", "#c9b89c"];
const color = n => PAL[names().indexOf(n)] || "#888";
const short = n => n.length > 2 ? n.slice(-2) : n;
const reading = k => grp().读数[k];
const kind = e => !e ? "none" : e.startsWith("unsure") ? "maybe" : e;
// 极性：act 对这道题是好事（+1）还是坏事（-1），只决定颜色
function tone(exit, pol){ const k = kind(exit); if (k === "maybe") return "maybe"; if (k === "act") return pol > 0 ? "good" : "bad"; if (k === "ignore") return pol > 0 ? "bad" : "good"; return "none"; }
const CV = {good: "var(--good)", bad: "var(--bad)", maybe: "var(--maybe)", none: "var(--ink3)"};
const same = (p, a, b) => (p[0] === a && p[1] === b) || (p[0] === b && p[1] === a);
const hanLen = s => [...String(s)].filter(c => !/\s/.test(c)).length;
const CN = ["零","一","二","三","四","五","六","七","八","九","十"];
const shortTime = l => { const m = String(l).match(/（(周.)）\s*(\d+:\d+)/); return m ? [m[1], m[2]] : [l, ""]; };
const selfOf = n => people().find(x => x.名 === n)?.自述 || "";
function pairSay(a, b){ const xs = grp().人物.关系.filter(s => s.涉及.length > 1 && s.涉及.every(x => x === a || x === b)); return xs.map(s => s.说法).join(" ") || "没有直接提到两人关系的说法。"; }

// ───────── 浮层（点开才有字） ─────────
const pop = $("pop");
function showPop(html, ev){
  pause();
  pop.innerHTML = `<button class="x" aria-label="关闭">×</button>` + html; pop.classList.add("show");
  pop.querySelector(".x").onclick = hidePop;
  const vw = innerWidth, vh = innerHeight, r = pop.getBoundingClientRect();
  let x = (ev?.clientX ?? vw / 2) + 14, y = (ev?.clientY ?? vh / 2) + 14;
  if (x + r.width > vw - 12) x = Math.max(12, (ev?.clientX ?? vw) - r.width - 14);
  if (y + r.height > vh - 12) y = Math.max(12, vh - r.height - 12);
  pop.style.left = clamp(x, 12, Math.max(12, vw - r.width - 12)) + "px"; pop.style.top = y + "px";
}
function hidePop(){ pop.classList.remove("show"); }
document.addEventListener("pointerdown", e => { if (pop.classList.contains("show") && !pop.contains(e.target) && !e.target.closest("[data-pop]")) hidePop(); });
const EXW = {act: "是", ignore: "否", maybe: "拿不准", none: "—"};
function chip(exit, pol, words){ const k = kind(exit); return `<span class="chip ${tone(exit, pol)}">${esc((words && words[k]) || EXW[k] || exit)}</span>`; }
function judgePop(j){
  const r = j.key ? reading(j.key) : null;
  let g = "";
  if (r && typeof r.读数 === "number") g = `<div class="gauge"><div class="band"></div><div class="nd" style="left:calc(${r.读数 * 100}% - 1px)"></div></div><div class="row note"><span>0 否</span><span>读数 <b style="color:var(--ink);font-family:var(--mono)">${r.读数.toFixed(2)}</b> · 线 0.3 / 0.7</span><span>是 1</span></div>`;
  else if (r && Array.isArray(r.读数)){ const mx = Math.max(...r.读数); g = `<div class="dist">${r.读数.map((x, k) => `<span>${esc((j.scale || [])[k] ?? "档 " + k)}</span><i style="width:${x / mx * 100}%"></i><span style="font-family:var(--mono)">${x.toFixed(2)}</span>`).join("")}</div>`; }
  else if (j.noReading) g = `<p class="note">${esc(j.noReading)}</p>`;
  return `<h4>${esc(j.title || "语义判断")}</h4><p class="q">「${esc(j.q)}」</p>${g}
    ${j.exit ? `<p style="margin:8px 0 0">出口 ${chip(j.exit, j.pol, j.words)}</p>` : ""}
    ${j.extra ? `<p class="mat">${j.extra}</p>` : ""}
    ${j.mat ? `<p class="mat">材料：${esc(j.mat)}</p>` : ""}
    ${r ? `<p class="note" style="margin:8px 0 0">${r.token} token · $${r.花费.toFixed(6)} · 账本键 ${esc(j.key)}</p>` : ""}`;
}
function personPop(n){ const p = people().find(x => x.名 === n); const rel = grp().人物.关系.filter(s => s.涉及.includes(n)); return `<h4>${esc(n)} · 住 ${esc(p.住处站)} 站</h4><p class="q">${esc(p.自述)}</p>${rel.length ? `<p class="mat">关系说法：${rel.map(s => esc(s.说法)).join("<br>")}</p>` : ""}`; }
function packetText(b){ return b.补了 && b.补了.length ? b.补了.map(x => `补进「${esc(x.类)}」：${esc(x.内容)}`).join("<br>") : "「最缺哪一类」这道选择题没选出来，没补成信息。"; }

// ───────── SVG 小件 ─────────
function personNode(n, x, y, r, extra = ""){
  return `<g class="hit" data-pop="person" data-n="${esc(n)}" ${extra}><circle cx="${x}" cy="${y}" r="${r}" fill="${color(n)}"/><text x="${x}" y="${y + r * .36}" text-anchor="middle" font-size="${Math.round(r * .78)}" font-weight="700" fill="#0d0f13">${esc(short(n))}</text></g>`;
}
function poly(n, cx, cy, r, rot = -Math.PI / 2){ return Array.from({length: n}, (_, i) => { const a = rot + i * 2 * Math.PI / n; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; }); }
function wedge(cx, cy, r0, r1, a0, a1){
  const p = (r, a) => [cx + r * Math.cos(a), cy + r * Math.sin(a)], L = a1 - a0 > Math.PI ? 1 : 0;
  const [x0, y0] = p(r1, a0), [x1, y1] = p(r1, a1), [x2, y2] = p(r0, a1), [x3, y3] = p(r0, a0);
  return `M${x0.toFixed(1)} ${y0.toFixed(1)}A${r1} ${r1} 0 ${L} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}L${x2.toFixed(1)} ${y2.toFixed(1)}A${r0} ${r0} 0 ${L} 0 ${x3.toFixed(1)} ${y3.toFixed(1)}Z`;
}
// 五人环：第 i 块永远是第 i 个人（从正上方顺时针）
function donut(cx, cy, r, tones, t0, dt, attrs = ""){
  const n = tones.length, gap = .07;
  return `<g ${attrs}>${tones.map((tn, i) => { const a0 = -Math.PI / 2 + i * 2 * Math.PI / n + gap / 2, a1 = a0 + 2 * Math.PI / n - gap; return `<path class="f" data-t="${(t0 + i * dt).toFixed(4)}" style="--c1:${CV[tn]}" d="${wedge(cx, cy, r * .5, r, a0, a1)}"/>`; }).join("")}</g>`;
}
const L = {
  line: (st, l) => `<span><svg width="26" height="8"><line x1="1" y1="4" x2="25" y2="4" style="${st}"/></svg>${l}</span>`,
  dot: (c, l, dash) => `<span><svg width="10" height="10"><circle cx="5" cy="5" r="4" fill="${dash ? "none" : c}" stroke="${c}" stroke-width="${dash ? 1.5 : 0}" ${dash ? 'stroke-dasharray="2 1.5"' : ""}/></svg>${l}</span>`,
  ring: () => `<span><svg width="14" height="14" viewBox="-7 -7 14 14">${names().map((n, i) => { const a0 = -Math.PI / 2 + i * 2 * Math.PI / 5 + .05, a1 = a0 + 2 * Math.PI / 5 - .1; return `<path d="${wedge(0, 0, 3, 7, a0, a1)}" fill="${color(n)}"/>`; }).join("")}</svg>圆环每块一人（人物色）</span>`,
  txt: l => `<span>${l}</span>`,
};
const STATUS = (good, bad) => L.line("stroke:var(--good);stroke-width:3", good) + L.line("stroke:var(--bad);stroke-width:3", bad) + L.line("stroke:var(--maybe);stroke-width:3;stroke-dasharray:5 4", "拿不准");

// ───────── 地图（步骤 3、4 共用） ─────────
const KX = Math.cos(30.25 * Math.PI / 180);
function mapBase(){
  if (mapBase.c) return mapBase.c;
  const la = D.餐厅.map(z => z[2]), lo = D.餐厅.map(z => z[3]);
  const b = {la0: Math.min(...la), la1: Math.max(...la), lo0: Math.min(...lo), lo1: Math.max(...lo)};
  const X = v => (v - b.lo0) * KX * 1000, Y = v => (b.la1 - v) * 1000; // 基准坐标：1 单位 ≈ 0.001°
  return mapBase.c = {b, X, Y, w: X(b.lo1), h: Y(b.la0)};
}
function bboxOf(pts, padFrac){
  const B = mapBase(), xs = pts.map(p => B.X(p[1])), ys = pts.map(p => B.Y(p[0]));
  let x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const px = (x1 - x0) * padFrac + 4, py = (y1 - y0) * padFrac + 4; return {x: x0 - px, y: y0 - py, w: x1 - x0 + 2 * px, h: y1 - y0 + 2 * py};
}
function fitView(rect, W, H){ const s = Math.min(W / rect.w, H / rect.h); return {s, tx: W / 2 - (rect.x + rect.w / 2) * s, ty: H / 2 - (rect.y + rect.h / 2) * s}; }
const lerpRect = (a, b, k) => ({x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k, w: a.w * Math.pow(b.w / a.w, k), h: a.h * Math.pow(b.h / a.h, k)});
function mapLayers(){
  const r = R().餐厅, B = mapBase();
  const cand = r.候选.map(c => { const z = D.餐厅.find(x => x[0] === c.id); return {...c, la: z[2], lo: z[3]}; });
  const target = bboxOf(r.家.map(h => h.坐标).concat(cand.map(c => [c.la, c.lo])), .12);
  const full = {x: 0, y: 0, w: B.w, h: B.h};
  return {r, B, cand, target, full};
}
function mapSkeleton(W, H){
  const {B} = mapLayers();
  const path = ring => ring.map((p, i) => (i ? "L" : "M") + B.X(p[1]).toFixed(1) + " " + B.Y(p[0]).toFixed(1)).join("");
  const lake = D.地图.西湖.map(rg => `<path d="${path(rg)}Z" fill="var(--lake)" stroke="var(--lake-ink)" stroke-width="1" vector-effect="non-scaling-stroke"/>`).join("");
  const river = D.地图.钱塘江.map(rg => `<path d="${path(rg)}" fill="none" stroke="var(--lake)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`).join("");
  return `<rect width="${W}" height="${H}" fill="var(--stage)"/><g id="geo">${river}${lake}</g>`;
}
function placeMap(view, sel){ // 把基准坐标按当前视窗投到屏幕
  document.getElementById("geo").setAttribute("transform", `translate(${view.tx},${view.ty}) scale(${view.s})`);
  const B = mapBase();
  sel.forEach(el => { const la = +el.dataset.la, lo = +el.dataset.lo; const x = B.X(lo) * view.s + view.tx, y = B.Y(la) * view.s + view.ty; if (el.tagName === "circle"){ el.setAttribute("cx", x.toFixed(1)); el.setAttribute("cy", y.toFixed(1)); } else el.setAttribute("transform", `translate(${x.toFixed(1)},${y.toFixed(1)})`); });
}

  let s = `<g class="hit" data-pop="judge" data-j='${esc(JSON.stringify({title: "整体复核", q: w.题[0], key: w.整体.键, exit: w.整体.出口, pol: -1, words: {act: "会", ignore: "不会"}, mat: "整份安排：时间 " + w.安排.时间 + "；餐厅 " + w.安排.餐厅 + "；座位 " + w.安排["座位（顺时针，首尾相接）"] + "；饭后 " + w.安排.饭后 + "；这桌菜（示例菜单）" + w.安排["这桌菜（示例菜单）"]}))}'>
    <path d="${arc(0, 1, gr)}" fill="none" stroke="var(--dim)" stroke-width="${gr * .16}"/>
    <path d="${arc(.3, .7, gr)}" fill="none" stroke="var(--maybe)" stroke-opacity=".35" stroke-width="${gr * .16}"/>
    <g id="needle"><line x1="${cx}" y1="${cy}" x2="${cx - gr * .92}" y2="${cy}" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/></g><circle cx="${cx}" cy="${cy}" r="${gr * .06}" fill="var(--ink)"/>
    <text x="${cx - gr}" y="${cy + gr * .2}" text-anchor="middle" font-size="12" fill="var(--ink3)">没人难受</text><text x="${cx + gr}" y="${cy + gr * .2}" text-anchor="middle" font-size="12" fill="var(--ink3)">有人难受</text></g>`;
  order.forEach((n, i) => { const x = w.逐人.find(z => z.名 === n); const [px, py] = seats[i]; if (!x) return;
    s += `<circle class="e hit" data-t="${(.55 + i * .06).toFixed(2)}" style="--c1:${CV[tone(x.出口, -1)]}" cx="${px}" cy="${py}" r="${nr + 7}" fill="none" stroke-width="5" data-pop="judge" data-j='${esc(JSON.stringify({title: "对 " + n, q: w.题[1], key: x.键, exit: x.出口, pol: -1, words: {act: "难受", ignore: "没事"}, mat: "整份安排 + 这个人：" + n}))}'/>${personNode(n, px, py, nr)}`; });
  return {svg: s, update(p, root){ if (val == null) return; const k = seg(p, .08, .5), ang = (k * val) * 180; const n = root.querySelector("#needle"); n.setAttribute("transform", `rotate(${ang.toFixed(1)} ${cx} ${cy})`); n.querySelector("line").setAttribute("stroke", p > .5 ? CV[tone(w.整体.出口, -1)] : "var(--ink)"); }};
}
function costStep(W, H){
  const rs = Object.entries(grp().读数), N = rs.length;
  const ratio = W / H; let cols = Math.max(8, Math.round(Math.sqrt(N * ratio))), rows = Math.ceil(N / cols);
  const cell = Math.min(W * .9 / cols, H * .84 / rows), x0 = (W - cell * cols) / 2, y0 = (H - cell * rows) / 2;
  const ex = exitMap();
  const s = rs.map(([k, r], i) => { const e = ex[k], fill = !e ? "none" : kind(e) === "maybe" ? "var(--maybe)" : "var(--ink2)";
    return `<rect class="cd hit" data-i="${i}" data-pop="cost" data-k="${esc(k)}" x="${x0 + (i % cols) * cell + cell * .14}" y="${y0 + Math.floor(i / cols) * cell + cell * .14}" width="${cell * .72}" height="${cell * .72}" rx="${cell * .2}" fill="${fill}" ${e ? "" : `stroke="var(--ink2)" stroke-width="1.5"`} opacity="0"/>`; }).join("");
  return {svg: s, update(p, root){ const k = Math.round(seg(p, .05, .8) * N); root.querySelectorAll(".cd").forEach(r => r.setAttribute("opacity", +r.dataset.i < k ? "1" : "0")); }};
}

// ───────── 浮层内容分派 ─────────
document.getElementById("svg").addEventListener("click", ev => {
  const el = ev.target.closest("[data-pop]"); if (!el) return;
  const kind_ = el.dataset.pop, i = +el.dataset.i;
  let h = "";
  if (kind_ === "person") h = personPop(el.dataset.n);
  else if (kind_ === "judge") h = judgePop(JSON.parse(el.dataset.j));
  else if (kind_ === "rel"){ const s = grp().人物.关系[i]; h = `<h4>${esc(s.涉及.join(" 与 "))}</h4><p class="q">${esc(s.说法)}</p><p class="note">线型是作者标的「${esc(s.类型.标签)}」，只给页面画线用；程序不读它，语义判断模型看到的只有原话。</p>`; }
  else if (kind_ === "rest"){ const {cand, r} = mapLayers(), c = cand[i]; h = `<h4>${esc(c.名)}</h4><p class="note">OSM ${esc(c.id)} · 菜系标签 ${esc(c.菜系 || "无")} · 营业时间 ${esc(c.营业时间 || "未标")}（${esc(c.营业)}）</p><p class="q">「${esc(r.题)}」</p>${c.判.map((x, k) => `<div class="row"><span>${esc(names()[k])} · ${c.通勤[k]} 分钟</span><span>${reading(x.键) ? reading(x.键).读数.toFixed(2) : ""} ${chip(x.出口, -1, {act: "撞", ignore: "不撞"})}</span></div>`).join("")}${c.id === r.选.id ? `<p class="mat">选中。选店规则写在代码里：没人判「撞」的店里，先挑营业时间已知且营业的，再挑拿不准少的，再挑最远那人通勤短的。通勤是估算。</p>` : ""}`; }
  else if (kind_ === "dish"){ const m = R().菜, d = m.逐道[i]; h = `<h4>${esc(d.菜.split("：")[0])} <span class="chip none">示例菜单</span></h4><p class="note">${esc(d.菜.split("：").slice(1).join("："))}</p><p class="q">「${esc(m.题[0])}」</p>${d.判.map((x, k) => `<div class="row"><span>${esc(names()[k])}</span><span>${reading(x.键) ? reading(x.键).读数.toFixed(2) : ""} ${chip(x.出口, -1, {act: "不愿吃", ignore: "能吃"})}</span></div>`).join("")}<p class="mat">${esc(m.注)}。${m.选中.includes(d.菜) ? "代码选中了这道。" : "代码没选这道。"}</p>`; }
  else if (kind_ === "tnode"){ const n = treeStep.nodes[i]; h = `<h4>题树节点</h4><p class="q">「${esc(n.node.q)}」</p>${n.pe ? `<p>出口 ${chip(n.pe.出口, 0, {act: "是", ignore: "否"})}</p>` : `<p class="note">这次没走到这个节点。</p>`}${n.node.add ? `<p class="mat">这一问请 ${esc(n.node.add)} 到场。</p>` : ""}${n.node.need ? `<p class="mat">可能缺的信息：${n.node.need.map(esc).join("；")}</p>` : ""}<p class="note">节点读数没有随报告输出（walk 只给整体证据），这里只显示出口。题树由生成模型出。</p>`; }
  else if (kind_ === "tleaf"){ const n = treeStep.nodes[i], l = n.node.leaf; h = `<h4>叶${n.reached ? "（这次落到这里）" : ""}</h4><p class="q">${esc(typeof l === "string" ? l : l.说明)}</p>${l.隔开 ? `<p class="mat">规则：${esc(l.隔开.join(" 和 "))} 隔开坐</p>` : ""}${l.中间 ? `<p class="mat">规则：${esc(l.中间)} 坐中间</p>` : ""}`; }
  else if (kind_ === "treefail") h = `<h4>题树生成失败</h4><p class="q">${esc(R().题树.失败)}</p>`;
  else if (kind_ === "rule"){ const t = R().题树; h = `<h4>题树给的规则</h4><p class="q">${esc(t.叶 ? t.叶.说明 : "")}</p><p class="note">5 人圆桌只有 ${seatCount(5)} 种本质不同的坐法，代码全部穷举：违反题树规则记 10 分，挨着尴尬记 2 分，挨着拿不准记 1 分，取最低分。</p>`; }
  else if (kind_ === "grp"){ const h9 = R().饭后, g = h9.分组[i]; h = `<h4>第 ${i + 1} 组：${esc(g.人.join("、"))}</h4><p class="q">${esc(g.活动 || "自由活动")}</p><p class="mat">分组依据：${esc(h9.分组依据)}。${h9.并列团.length ? "另有同样大的团：" + h9.并列团.map(x => esc(x.join("、"))).join("；") + "。这个分组的依据很弱。" : "没有同样大的并列团。"}</p><p class="note">活动由生成模型提；代码在判出来的「自在」图上跑最大团（graph:max_clique）。</p>`; }
  else if (kind_ === "act"){ const h9 = R().饭后, a = h9.逐项[i]; h = `<h4>${esc(a.活动.split("：")[0])}</h4><p class="note">${esc(a.活动.split("：").slice(1).join("："))}</p><p class="q">「${esc(h9.题[0])}」</p>${a.判.map((x, k) => `<div class="row"><span>${esc(names()[k])}</span><span>${reading(x.键) ? reading(x.键).读数.toFixed(2) : ""} ${chip(x.出口, -1, {act: "不舒服", ignore: "没问题"})}</span></div>`).join("")}<p class="note">候选活动由生成模型提。</p>`; }
  else if (kind_ === "cost"){ const r = reading(el.dataset.k); const e = exitMap()[el.dataset.k]; h = `<h4>账本里的一次判断</h4><p class="note">${e ? "出口 " + chip(e, 0, {act: "是", ignore: "否"}) + " · " : "这个键在报告里没有对应的出口 · "}类型 ${esc(r.型)} · 读数 ${esc(Array.isArray(r.读数) ? r.读数.join(" / ") : r.读数)} · ${r.token} token · $${r.花费.toFixed(6)}</p><p class="note">账本键 ${esc(el.dataset.k)}</p><p class="mat">这一组：账本判断 ${grp().账本.判断条数} 条、生成 ${grp().账本.生成} 次（本机订阅，不计价）、代码动作 ${grp().账本.动作} 次；报告新调用 ${grp().花费.calls} 次、$${grp().花费.usd.toFixed(4)}；全程未决 ${R().未决条数} 条都随返回值交出。</p>`; }
  if (h) showPop(h, ev);
});
$("info").onclick = ev => showPop(`<h4>这页怎么看</h4><p class="q">一次真机运行的十二步，自动播放。画面上的圆点、连线、座位、餐厅都能点开，看题面、材料、读数和出口。</p><p class="mat">红、绿、琥珀只表示语义判断的结果：绿是好的一侧，红是坏的一侧，琥珀虚线是拿不准（读数在 0.3–0.7 之间）。人物用各自的颜色；作者标的关系线型、题树给的规则用灰白线。</p><p class="mat">餐厅、地铁站、西湖与钱塘江轮廓：${esc(D.来源.OSM)}，${esc(D.来源.实例)}，查询于 ${esc(D.来源.查询时间)}。</p><p class="mat">「示例菜单」「饭后活动」「题树」由生成模型拟，不是事实。所有读数、出口、花费取自 真机/ 下的报告与账本，由 脚本/网页数据.py 搬进 data.js；页面不调接口。</p><p class="note">键盘：← → 换步，空格 播放 / 暂停。链接 #甲组/7 直接打开某组某步。</p>`, ev);

// ───────── 时间线 ─────────
const TOTAL = STEPS.reduce((a, s) => a + s.dur, 0);
const START = STEPS.map((_, i) => STEPS.slice(0, i).reduce((a, s) => a + s.dur, 0));
function locate(t){ let i = STEPS.length - 1; for (let k = 0; k < STEPS.length; k++) if (t < START[k] + STEPS[k].dur){ i = k; break; } return [i, clamp((t - START[i]) / STEPS[i].dur)]; }
function renderGroups(){ $("groups").innerHTML = G_NAMES.map(g => `<button class="gbtn" aria-pressed="${g === S.g}" data-g="${esc(g)}">${esc((D.组[g].人物.组 || g).split("·").pop())}</button>`).join(""); $("groups").querySelectorAll(".gbtn").forEach(b => b.onclick = () => { S.g = b.dataset.g; renderGroups(); S.idx = -1; frame(); }); }
function setNums(arr){
  const box = $("nums");
  if (box.children.length !== arr.length) box.innerHTML = arr.map(() => `<div class="num"><b></b><span></span></div>`).join("");
  arr.forEach(([v, l, c], i) => { const el = box.children[i]; el.className = "num " + (c || ""); const b = el.firstChild, sp = el.lastChild; if (b.textContent !== String(v)) b.textContent = v; if (sp.textContent !== l) sp.textContent = l; });
}
function buildStep(i){
  const st = STEPS[i], svg = $("svg"), W = Math.max(1, $("stage").clientWidth), H = Math.max(1, $("stage").clientHeight);
  S.W = W; S.H = H; hidePop();
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  $("legend").innerHTML = st.legend();
  const out = st.build(W, H - $("legend").offsetHeight - 14);
  svg.innerHTML = out.svg;
  S.cur = {update: out.update || null, timed: [...svg.querySelectorAll("[data-t],[data-t2]")]};
  const title = st.title();
  $("title").innerHTML = `<span class="in">${esc(title)}</span>`;
  svg.setAttribute("aria-label", title);
  $("credit").textContent = st.credit ? "© OpenStreetMap contributors" : "";
  $("stepno").textContent = `${i + 1} / ${STEPS.length}`;
  try { if (!S.freeze) history.replaceState(null, "", "#" + encodeURIComponent(S.g) + "/" + (i + 1)); } catch (e) {}
}
function frame(){
  const [i, p] = locate(S.t);
  if (i !== S.idx){ S.idx = i; buildStep(i); }
  const root = $("svg");
  S.cur.timed.forEach(el => { const t1 = el.dataset.t, t2 = el.dataset.t2; if (t1 !== undefined) el.classList.toggle("on", p >= +t1); if (t2 !== undefined) el.classList.toggle("on2", p >= +t2); });
  if (S.cur.update) S.cur.update(p, root);
  setNums(STEPS[i].nums(p));
  const f = S.t / TOTAL * 100; $("fill").style.width = f + "%"; $("knob").style.left = f + "%";
}
function loop(ts){
  const dt = S.last ? Math.min(.1, (ts - S.last) / 1000) : 0; S.last = ts;
  if (S.playing){ S.t = Math.min(TOTAL, S.t + dt); if (S.t >= TOTAL) pause(); frame(); }
  requestAnimationFrame(loop);
}
const ICON = {play: `<svg viewBox="0 0 14 14"><path d="M3 1.5v11l9-5.5z" fill="currentColor"/></svg>`, pause: `<svg viewBox="0 0 14 14"><rect x="2.5" y="1.5" width="3.2" height="11" rx="1" fill="currentColor"/><rect x="8.3" y="1.5" width="3.2" height="11" rx="1" fill="currentColor"/></svg>`};
function syncPP(){ $("pp").innerHTML = S.playing ? ICON.pause : ICON.play; $("pp").setAttribute("aria-label", S.playing ? "暂停" : "播放"); }
function pause(){ S.playing = false; syncPP(); }
function play(){ if (S.t >= TOTAL - .01) S.t = 0; S.playing = true; syncPP(); }
$("pp").onclick = () => S.playing ? pause() : play();
function seekStep(i){ S.t = START[clamp(i, 0, STEPS.length - 1)] + .001; frame(); }
document.addEventListener("keydown", e => { const [i] = locate(S.t); if (e.key === "ArrowRight"){ seekStep(i + 1); } else if (e.key === "ArrowLeft"){ seekStep(S.t - START[i] > 1.5 ? i : i - 1); } else if (e.key === " "){ e.preventDefault(); S.playing ? pause() : play(); } else if (e.key === "Escape") hidePop(); });
(function(){ // 细进度条：点、拖
  const tr = $("track"); let drag = false;
  const at = e => { const r = tr.getBoundingClientRect(); S.t = clamp((e.clientX - r.left) / r.width) * TOTAL; if (S.t >= TOTAL) S.t = TOTAL - .001; frame(); };
  tr.addEventListener("pointerdown", e => { drag = true; tr.setPointerCapture(e.pointerId); S.wasPlaying = S.playing; S.playing = false; at(e); });
  tr.addEventListener("pointermove", e => { if (drag) at(e); });
  tr.addEventListener("pointerup", () => { drag = false; S.playing = S.wasPlaying; syncPP(); });
  $("ticks").innerHTML = START.slice(1).map(s => `<div class="tick" style="left:${s / TOTAL * 100}%"></div>`).join("");
})();
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { S.idx = -1; frame(); }, 120); });

// 深链：#甲组/7 打开某组某步并从那里播；#甲组/7@0.9 停在那一步的 90% 处（截图用，关掉过渡）
(function(){
  const raw = decodeURIComponent(location.hash.slice(1)), [gs, rest = ""] = raw.split("/"), [ns, ps] = rest.split("@");
  if (gs && D.组[gs]) S.g = gs;
  const n = parseInt(ns, 10); if (n > 0) S.t = START[Math.min(n, STEPS.length) - 1] + .001;
  if (ps !== undefined){ S.freeze = true; document.documentElement.classList.add("freeze"); S.playing = false; S.t = START[Math.min(n || 1, STEPS.length) - 1] + clamp(parseFloat(ps) || 0) * STEPS[Math.min(n || 1, STEPS.length) - 1].dur * .9999; }
  renderGroups(); syncPP(); frame(); requestAnimationFrame(loop);
})();

// 自查：?check 时把尺寸、滚动、字数、标题长度写进 #check
if (/[?&]check/.test(location.search)) setTimeout(() => {
  const vw = innerWidth, vh = innerHeight, de = document.documentElement, st = $("stage").getBoundingClientRect();
  const visText = () => { let n = 0; document.querySelectorAll("#title, #nums, #legend, #credit, #groups, #stepno").forEach(e => n += hanLen(e.textContent)); $("svg").querySelectorAll("text").forEach(t => { let o = 1, el = t; while (el && el !== $("svg")){ o *= +getComputedStyle(el).opacity; el = el.parentElement; } if (o > .05) n += hanLen(t.textContent); }); return n; };
  const titles = []; const g0 = S.g;
  for (const g of G_NAMES){ S.g = g; STEPS.forEach((s, i) => { const t = s.title(); titles.push({g, i: i + 1, t, len: hanLen(t)}); }); }
  S.g = g0;
  const out = {vw, vh, scrollW: de.scrollWidth, scrollH: de.scrollHeight, bodyScrollH: document.body.scrollHeight, stageRatio: +(st.width * st.height / (vw * vh)).toFixed(3), stageInView: st.top >= 0 && st.left >= 0 && st.right <= vw + .5 && st.bottom <= vh + .5, visibleChars: visText(), titleMax: Math.max(...titles.map(x => x.len)), titlesOver20: titles.filter(x => x.len > 20), errors: window.__errs};
  $("check").textContent = JSON.stringify(out);
}, 400);
</script>
</body>

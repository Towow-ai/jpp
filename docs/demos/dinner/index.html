<!doctype html>
<html lang="zh-CN">
<head>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>杭州聚餐</title>
<meta name="description" content="一次真机运行：代码、语义判断模型、生成模型一起，给五个杭州朋友安排一顿饭。">
<style>
:root{
  --bg:#04060c; --panel:rgba(8,12,22,.86); --line:rgba(140,170,220,.16); --line2:rgba(160,190,240,.32);
  --fg:#e8eefb; --fg2:#a9b6cf; --fg3:#6c7a96;
  --good:#3ef0b0; --maybe:#ffb547; --bad:#ff5b6e; --warm:#ff9150; --info:#9fe6ff;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
#cv{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;pointer-events:none}
#app > *{pointer-events:none}
#top{display:grid;grid-template-columns:1fr auto;grid-template-areas:"bar nums" "title nums";column-gap:24px;padding:14px 28px 0}
.bar{grid-area:bar;display:flex;align-items:center;gap:12px;pointer-events:auto}
#gbtn{background:rgba(255,255,255,.06);border:1px solid var(--line2);border-radius:999px;padding:4px 14px;font-size:14px;color:var(--fg)}
#gbtn:hover{border-color:var(--fg2)}
#gmenu{position:absolute;margin-top:6px;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:6px;display:flex;flex-direction:column;z-index:30;backdrop-filter:blur(8px)}
#gmenu button{background:none;border:0;text-align:left;padding:8px 14px;border-radius:8px;font-size:15px}
#gmenu button:hover,#gmenu button[aria-pressed=true]{background:rgba(255,255,255,.08)}
.gsel{position:relative}
#gmenu[hidden]{display:none}
#stepno{font-family:var(--mono);color:var(--fg3);font-size:14px;letter-spacing:.08em}
#info{width:26px;height:26px;border-radius:50%;border:1px solid var(--line2);background:none;font-family:var(--mono);font-size:14px;color:var(--fg2);padding:0}
#info:hover{color:var(--fg);border-color:var(--fg2)}
#title{grid-area:title;margin:6px 0 0;font-size:clamp(26px,3.1vw,54px);font-weight:600;line-height:1.18;letter-spacing:.02em;text-shadow:0 0 28px rgba(122,167,255,.45);min-height:1.18em}
#title span{display:inline-block}
#title span.in{animation:tin .7s cubic-bezier(.2,.9,.25,1)}
@keyframes tin{from{opacity:0;transform:translateY(10px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
#nums{grid-area:nums;display:flex;gap:28px;align-items:flex-end;justify-content:flex-end;align-self:center;pointer-events:auto}
.num{display:flex;flex-direction:column;align-items:flex-end;cursor:default}
.num b{font-family:var(--mono);font-weight:600;font-size:clamp(28px,3vw,52px);line-height:1;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 0 22px rgba(62,240,176,.35)}
.num span{margin-top:6px;color:var(--fg2);font-size:15px;letter-spacing:.06em}
.num.small b{font-size:clamp(22px,1.9vw,32px);color:var(--fg2);text-shadow:none}
.num.good b{color:var(--good);text-shadow:0 0 22px rgba(62,240,176,.5)}
.num.bad b{color:var(--bad);text-shadow:0 0 22px rgba(255,91,110,.5)}
.num.maybe b{color:var(--maybe);text-shadow:0 0 18px rgba(255,181,71,.35)}
.num.warm b{color:#ffc49a;text-shadow:0 0 22px rgba(255,145,80,.5)}
#stage{position:relative}
#ctrl{display:flex;align-items:center;gap:16px;padding:10px 28px 16px;pointer-events:auto}
#pp{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:rgba(255,255,255,.05);display:grid;place-items:center;padding:0;flex:none}
#pp svg{width:14px;height:14px}
#track{position:relative;flex:1;height:28px;cursor:pointer;touch-action:none}
.rail{position:absolute;left:0;right:0;top:12px;height:4px;border-radius:2px;background:rgba(255,255,255,.12)}
#fill{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:linear-gradient(90deg,#3ef0b0,#57d4ff);box-shadow:0 0 12px rgba(87,212,255,.6)}
.tick{position:absolute;top:-4px;width:2px;height:12px;background:rgba(255,255,255,.28);border-radius:1px}
#knob{position:absolute;top:6px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#fff;box-shadow:0 0 14px rgba(87,212,255,.9)}
#credit{position:fixed;right:28px;bottom:62px;font-size:14px;color:var(--fg3);font-family:var(--mono);pointer-events:none;transition:opacity .4s}
#pop{position:fixed;z-index:50;max-width:min(460px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;background:rgba(10,15,28,.96);border:1px solid var(--line2);border-radius:14px;padding:16px 18px 14px;font-size:15px;line-height:1.6;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 40px rgba(87,212,255,.08);display:none;pointer-events:auto}
#pop.show{display:block;animation:tin .25s ease-out}
#pop h4{margin:0 30px 8px 0;font-size:17px}
#pop p{margin:6px 0}
#pop .q{color:var(--fg)}
#pop .note{color:var(--fg3);font-size:14px}
#pop .x{position:absolute;right:10px;top:8px;width:28px;height:28px;border:0;background:none;color:var(--fg2);font-size:20px}
#pop details{margin-top:8px;color:var(--fg2);font-size:14px}
#pop summary{cursor:pointer;color:var(--info)}
#pop table{border-collapse:collapse;width:100%;font-size:14px;margin-top:6px}
#pop td,#pop th{padding:3px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
#pop th{color:var(--fg3);font-weight:400}
.chip{display:inline-block;padding:0 8px;border-radius:999px;font-size:14px;border:1px solid currentColor;line-height:1.6}
.chip.good{color:var(--good)} .chip.bad{color:var(--bad)} .chip.maybe{color:var(--maybe)} .chip.none{color:var(--fg3)}
.gauge{position:relative;height:10px;border-radius:5px;margin:10px 0 2px;background:linear-gradient(90deg,rgba(255,255,255,.1) 0 30%,rgba(255,181,71,.35) 30% 70%,rgba(255,255,255,.1) 70%)}
.gauge i{position:absolute;top:-4px;width:3px;height:18px;margin-left:-1px;background:#fff;border-radius:2px;box-shadow:0 0 8px #fff}
.grow{display:flex;justify-content:space-between;color:var(--fg3);font-size:14px;font-family:var(--mono)}
.dist{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;margin-top:8px;font-size:14px}
.dist i{display:block;height:8px;border-radius:4px;background:var(--info)}
/* 海报 */
#poster{position:absolute;inset:0;display:none;pointer-events:auto}
#poster.show{display:block}
.pgrid{position:absolute;inset:4px 28px 8px;display:grid;grid-template-columns:1.3fr 1fr 1fr;grid-template-rows:1fr auto;gap:18px}
.pcard{background:rgba(8,13,26,.86);border:1px solid var(--line);border-radius:18px;padding:26px 28px;position:relative;overflow:hidden;cursor:pointer;opacity:0;transform:translateY(14px);transition:opacity .6s, transform .6s, border-color .2s;display:flex;flex-direction:column;justify-content:center}
.pcard.on{opacity:1;transform:none}
.pcard:hover{border-color:var(--line2)}
.ptime{font-size:clamp(26px,2.9vw,56px);white-space:nowrap;font-weight:600;line-height:1.1;letter-spacing:.01em}
.pplace{font-size:clamp(22px,2.4vw,44px);font-weight:600;margin-top:18px;line-height:1.15;color:#ffd2b0;text-shadow:0 0 24px rgba(255,145,80,.45)}
.pdish{margin-top:22px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pdish span{border:1px solid rgba(255,181,71,.4);border-radius:999px;padding:4px 14px;font-size:clamp(16px,1.35vw,24px);color:#ffe2c4;background:rgba(255,145,80,.06)}
.pdish em{font-style:normal;color:var(--fg3);font-size:15px;font-family:var(--mono)}
.ptag{align-self:flex-start;margin-top:14px;font-size:14px;color:var(--maybe);border:1px dashed rgba(255,181,71,.6);border-radius:6px;padding:1px 8px}
.pbig{grid-column:1 / -1;display:flex;gap:18px}
.pbig .pcard{flex:1;flex-direction:row;align-items:baseline;justify-content:flex-start;gap:14px;padding:14px 28px}
.pbig b{font-family:var(--mono);font-size:clamp(38px,4.6vw,84px);font-weight:600;line-height:1;text-shadow:0 0 30px rgba(87,212,255,.55)}
.pbig span{color:var(--fg2);font-size:clamp(15px,1.3vw,22px)}
.pact{display:flex;flex-direction:column;gap:30px}
.pact div{font-size:clamp(20px,2vw,36px);font-weight:600;line-height:1.3}
.pact i{display:inline-block;width:16px;height:16px;border-radius:50%;margin-right:8px;box-shadow:0 0 12px currentColor;vertical-align:middle}
.pseat{padding:10px}
.pseat svg{width:100%;height:100%}
@media (max-width: 720px){
  #top{grid-template-columns:1fr;grid-template-areas:"bar" "title" "nums";padding:10px 16px 0}
  #title{font-size:24px;margin-top:6px}
  #nums{justify-content:flex-start;gap:22px;margin-top:8px;align-self:start}
  .num{align-items:flex-start}
  .num b{font-size:26px}
  .num.small b{font-size:20px}
  .num span{font-size:14px;margin-top:3px}
  #ctrl{padding:6px 16px 12px;gap:12px}
  #credit{right:16px;bottom:56px;font-size:14px}
  .pgrid{inset:0 16px 6px;grid-template-columns:1fr;grid-template-rows:auto 1fr auto auto;gap:10px}
  .pact{flex-direction:row;gap:14px}
  .pact div{flex:1}
  .pcard{padding:14px 16px;border-radius:14px}
  .ptime{font-size:26px}
  .pplace{font-size:21px;margin-top:8px}
  .pbig{gap:10px}
  .pbig .pcard{flex-direction:column;gap:4px;padding:10px 14px}
  .pbig b{font-size:30px}
  .pdish{margin-top:10px;gap:6px}
  .pdish span{font-size:14px;padding:2px 9px}
  .ptag{margin-top:8px}
  .pact{gap:16px}
  .pact div{font-size:17px}
  .pact i{width:12px;height:12px;margin-right:4px}
}
@media (prefers-reduced-motion: reduce){ #title span.in{animation:none} }
</style>
</head>
<body>
<canvas id="cv" aria-hidden="true"></canvas>
<div id="app">
  <header id="top">
    <div class="bar">
      <div class="gsel"><button id="gbtn" aria-haspopup="true" aria-expanded="false"></button><div id="gmenu" hidden></div></div>
      <span id="stepno"></span>
      <button id="info" aria-label="说明与数据来源">i</button>
    </div>
    <h1 id="title" aria-live="polite"></h1>
    <div id="nums"></div>
  </header>
  <main id="stage"><div id="poster"></div></main>
  <footer id="ctrl">
    <button id="pp" aria-label="暂停"></button>
    <div id="track" role="slider" aria-label="播放进度" tabindex="0"><div class="rail"><div id="fill"></div><div id="ticks"></div></div><div id="knob"></div></div>
  </footer>
</div>
<div id="credit">© OpenStreetMap contributors</div>
<div id="pop" role="dialog"></div>
<script>window.__errs=[];addEventListener("error",e=>window.__errs.push(String(e.message||e)));addEventListener("unhandledrejection",e=>window.__errs.push("promise: "+String(e.reason)));</script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
